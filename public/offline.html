<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0e0f1a" />
  <title>Offline · WorkForce</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box;
      background: #0a0b14; color: #f0f0f8; font-family: system-ui, -apple-system, sans-serif; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 1.3rem; margin: 1rem 0 0.4rem; }
    p { color: #8b8da3; margin: 0 0 1.5rem; font-size: 0.95rem; line-height: 1.5; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 1.25rem; border-radius: 12px;
      background: linear-gradient(135deg, #6c63ff 0%, #9b5de5 50%, #f15bb5 100%); color: #fff; font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.5); }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>WorkForce needs a connection to show the roster and tasks.<br />Check your network and try again.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
