name: CI

# Shared workflow: https://github.com/MusDev99/ci-workflows
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci:
    uses: MusDev99/ci-workflows/.github/workflows/node-ci.yml@main
    with:
      audit-level: critical   # lower severities tracked in docs/audits
